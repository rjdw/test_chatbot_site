<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-adsense-account" content="ca-pub-5642788581103145" />
    <title>Writing — Richard Wang</title>
    <meta
      name="description"
      content="Full archive of essays, notes, and updates from Richard Wang."
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght,SOFT@9..144,300..700,30..100&display=swap"
    />
    <script type="module" crossorigin src="/assets/router-BRbTynHI.js"></script>
    <script type="module" crossorigin src="/assets/archive-CLdQ7Nb0.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/router-5RjZ5JxN.css">
  </head>
  <body>
    <main id="page-content" class="archive-shell">
      <article class="archive-page">
        <a class="post-back" href="/">← Back home</a>

        <header class="archive-head">
          <span class="blog-eyebrow">Archive</span>
          <h1 class="archive-title">
            All <em class="blog-em">writing</em>
          </h1>
          <p class="archive-sub">
            Essays, notes, and updates. Filter, search, and scroll.
          </p>
        </header>

        <div class="archive-controls" role="search">
          <label class="archive-search">
            <svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="9" cy="9" r="6" />
              <path d="M14 14l4 4" />
            </svg>
            <input
              id="archive-search-input"
              type="search"
              placeholder="Search writing…"
              autocomplete="off"
            />
          </label>

          <div class="archive-tabs" role="tablist" aria-label="Filter by kind">
            <button
              class="archive-tab is-active"
              data-filter="all"
              role="tab"
              aria-selected="true"
            >
              All
            </button>
            <button
              class="archive-tab"
              data-filter="essay"
              role="tab"
              aria-selected="false"
            >
              Essays
            </button>
            <button
              class="archive-tab"
              data-filter="note"
              role="tab"
              aria-selected="false"
            >
              Notes
            </button>
            <button
              class="archive-tab"
              data-filter="media"
              role="tab"
              aria-selected="false"
            >
              Media
            </button>
            <button
              class="archive-tab"
              data-filter="draft"
              role="tab"
              aria-selected="false"
            >
              Drafts
            </button>
          </div>
        </div>

        <div class="archive-tags" id="archive-tags" aria-label="Filter by tag"></div>

        <div class="archive-meta">
          <span id="archive-count">—</span>
          <span class="archive-sep">·</span>
          <span id="archive-active-filters">Showing everything</span>
        </div>

        <ol
          id="archive-list"
          class="blog-entries archive-list"
          role="list"
        ></ol>

        <p id="archive-empty" class="archive-empty" hidden>
          No writing matches those filters.
        </p>
      </article>
    </main>

    <footer class="blog-footer">
      <div class="blog-footer-inner">
        <a class="blog-footer-mark" href="/">
          <svg
            viewBox="0 0 40 20"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.4"
            aria-hidden="true"
          >
            <path
              d="M10 10c0-4 4-6 7-3s5 6 8 6 6-2 6-5-3-6-6-5-5 4-8 6-5 5-7 4-4-2-4-5 3-5 6-5"
            />
          </svg>
          Richard Wang
        </a>
        <nav class="blog-footer-nav" aria-label="Footer">
          <a href="/#about">About</a>
          <a href="/#essays">Essays</a>
          <a href="/#faq">FAQ</a>
          <a href="https://cladlabs.ai" target="_blank" rel="noopener"
            >Clad Labs</a
          >
        </nav>
        <p class="blog-footer-copy">
          &copy; 2025 Richard Wang. Opinions are my own.
        </p>
      </div>
    </footer>

  </body>
</html>
